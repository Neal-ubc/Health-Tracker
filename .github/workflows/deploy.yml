name: Validate and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: health-tracker-neal  # TODO: set to your Azure Web App's name

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Boot the app and check it responds
        run: |
          streamlit run app.py --server.headless true --server.port 8501 &
          APP_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8501/_stcore/health > /dev/null; then
              echo "App is up"
              kill $APP_PID
              exit 0
            fi
            sleep 1
          done
          echo "App did not become healthy in time"
          kill $APP_PID
          exit 1

  deploy:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Belt-and-suspenders: the Azure Portal's Configuration UI can be easy
      # to mis-save or apply to the wrong slot. Re-assert both settings on
      # every deploy so a wrong click in the Portal can never silently break
      # the next release.
      - name: Ensure startup command and build settings are correct
        run: |
          RG=$(az webapp list --query "[?name=='${{ env.AZURE_WEBAPP_NAME }}'] | [0].resourceGroup" -o tsv)
          if [ -z "$RG" ]; then
            echo "Could not find a Web App named '${{ env.AZURE_WEBAPP_NAME }}' in this subscription/service principal scope." >&2
            exit 1
          fi
          echo "Resource group: $RG"

          az webapp config set \
            --resource-group "$RG" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --startup-file "python -m streamlit run app.py --server.port 8000 --server.address 0.0.0.0"

          az webapp config appsettings set \
            --resource-group "$RG" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      - name: Log out of Azure
        if: always()
        run: az logout || true
