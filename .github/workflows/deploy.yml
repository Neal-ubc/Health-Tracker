name: Validate and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: health-tracker-neal  # TODO: set to your Azure Web App's name

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Boot the app and check it responds
        run: |
          streamlit run app.py --server.headless true --server.port 8501 &
          APP_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8501/_stcore/health > /dev/null; then
              echo "App is up"
              kill $APP_PID
              exit 0
            fi
            sleep 1
          done
          echo "App did not become healthy in time"
          kill $APP_PID
          exit 1

  deploy:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One-time setup in the Azure Portal for the Web App (Linux, Python 3.11):
      #   Configuration > General settings > Startup Command:
      #   python -m streamlit run app.py --server.port 8000 --server.address 0.0.0.0
      #
      # Then download the app's publish profile (Overview > Get publish profile)
      # and add its contents as the repo secret AZURE_WEBAPP_PUBLISH_PROFILE.
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
